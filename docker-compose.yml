services:
  hcp-reference:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: hcp-reference

    restart: unless-stopped

    init: true

    env_file:
      - .env

    environment:
      HCP_STORAGE: postgres

    ports:
      - "127.0.0.1:8001:8000"

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
        ]
      interval: 30s
      timeout: 5s
      start_period: 20s